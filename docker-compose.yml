services:
  postgres:
    image: postgres:16-alpine
    container_name: cocktail-orders-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cocktail
      POSTGRES_PASSWORD: cocktail
      POSTGRES_DB: cocktail
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
