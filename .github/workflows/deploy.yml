name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write ermoeglicht den OIDC-Login gegen Azure (azure/login tauscht
# das GitHub-OIDC-Token gegen ein kurzlebiges Azure-Access-Token, ohne dass
# irgendwo ein langlebiger Client-Secret-Key als GitHub-Secret liegen muss).
# packages: write wird fuer den Push des Backend-Images nach GHCR gebraucht.
# Never run two deploys at once: Azure rejects parallel infrastructure
# deployments (DeploymentActive). A second run waits instead of failing; if
# one is already waiting, the newest replaces it (it contains all commits).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  packages: write

env:
  AZURE_RESOURCE_GROUP: cocktail-orders-dev-rg
  AZURE_LOCATION: germanywestcentral
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cocktail-orders-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --- 1. Backend-Image bauen und nach GHCR pushen -------------------------
      # Muss VOR dem Bicep-Deployment passieren: die Container App referenziert
      # das Image ueber seinen Tag. Wuerde der Tag beim Deployment noch nicht
      # existieren, wuerde die neue Revision beim Start fehlschlagen
      # (Image-Pull-Error).
      - name: In GitHub Container Registry einloggen
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend-Image bauen und pushen
        run: |
          IMAGE_TAG="${IMAGE_NAME,,}:${{ github.sha }}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          docker build -f server/Dockerfile -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

      # --- 2. Bei Azure einloggen (OIDC / Federated Credentials) ---------------
      - name: Bei Azure einloggen
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resource Group sicherstellen
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --output none

      # --- 3. Infrastruktur deployen (Bicep) ------------------------------------
      # GHCR_PAT (nicht das ephemere GITHUB_TOKEN!) wird als Registry-Passwort
      # in die Container App geschrieben, weil sie das Image ggf. Stunden/Tage
      # spaeter aus dem Stillstand heraus erneut zieht (Scale-to-Zero) - da ist
      # GITHUB_TOKEN laengst abgelaufen.
      - name: Infrastruktur deployen
        id: infra
        # Secrets kommen ueber env: rein statt direkt per ${{ }} in den
        # Bash-Befehl interpoliert zu werden - sonst koennten "$"-Zeichen im
        # Secret-Wert (z. B. in einem Connection-String oder Passwort-Hash)
        # von Bash als (leere) Variablen fehlinterpretiert werden.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BARKEEPER_PASSWORD: ${{ secrets.BARKEEPER_PASSWORD }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Azure occasionally fails with DeploymentActive: a nested deployment counts
          # as "still active" although no other deploy is running, and a retry works.
          # For exactly this error (and the occasional CLI error "already consumed")
          # retry up to 3 times; any other error fails immediately.
          for attempt in 1 2 3; do
            if OUTPUTS=$(az deployment group create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/main.bicep \
              --parameters infra/main.parameters.json \
              --parameters \
                databaseUrl="$DATABASE_URL" \
                barkeeperPassword="$BARKEEPER_PASSWORD" \
                containerImage="$IMAGE_TAG" \
                registryUsername="${{ github.actor }}" \
                registryPassword="$GHCR_PAT" \
                groqApiKey="$GROQ_API_KEY" \
              --query properties.outputs -o json 2> deploy-error.log); then
              break
            fi
            cat deploy-error.log
            if [ "$attempt" -lt 3 ] && grep -qE "DeploymentActive|still active|already consumed" deploy-error.log; then
              echo "::warning::Azure reports a nested deployment as still active, retrying in 60 s"
              sleep 60
              continue
            fi
            exit 1
          done

          echo "container_app_url=$(echo "$OUTPUTS" | jq -r '.containerAppUrl.value')" >> "$GITHUB_OUTPUT"
          echo "static_web_app_name=$(echo "$OUTPUTS" | jq -r '.staticWebAppName.value')" >> "$GITHUB_OUTPUT"

      # --- 3b. Datenbank-Migrationen anwenden -----------------------------------
      # Neon ist standardmaessig oeffentlich erreichbar (kein IP-Firewall-
      # Handshake wie bei Azure Postgres Flexible Server noetig), daher entfaellt
      # das Oeffnen/Schliessen einer Firewall-Regel fuer den Runner.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      - name: Migrationen anwenden
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      # --- 4. Frontend bauen ------------------------------------------------------
      # VITE_API_URL muss zur BUILD-Zeit gesetzt sein (landet im statischen
      # JS-Bundle) - deshalb erst jetzt, nachdem wir die frisch deployte
      # Container-App-URL aus Schritt 3 kennen.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The deploy step reports success as soon as Azure accepts the new image, not
      # once the app actually starts with it (job-application-skill#14: the API did
      # not start, the deploy was still green). So wait until exactly the new revision
      # runs as healthy in Azure AND the endpoint answers. The endpoint alone is not
      # enough: it returned 200 even though the new revision was broken.
      - name: Smoke test of the new revision
        env:
          APP: cocktail-orders-dev-server
          RG: ${{ env.AZURE_RESOURCE_GROUP }}
          URL: ${{ steps.infra.outputs.container_app_url }}/api/ping
          MAX_CODE: "300"
        run: |
          REV=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv)
          echo "Neue Revision: $REV"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$URL" || true)
            STATE=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$REV" \
              --query "join('/', [properties.healthState, properties.runningState])" -o tsv)
            echo "Versuch $i: HTTP $CODE, Revision $STATE"
            case "$STATE" in
              *Failed*) echo "::error::Revision $REV startet nicht ($STATE)"; exit 1 ;;
              */Stopped)
                LATEST=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv)
                if [ "$LATEST" != "$REV" ]; then echo "Revision wurde durch $LATEST abgelöst"; exit 0; fi ;;
              Healthy/Running*)
                if [ "$CODE" -ge 200 ] && [ "$CODE" -lt "$MAX_CODE" ]; then echo "OK"; exit 0; fi ;;
            esac
            sleep 10
          done
          echo "::error::Revision $REV nach 5 Minuten nicht gesund"; exit 1

      - name: Frontend bauen
        env:
          VITE_API_URL: ${{ steps.infra.outputs.container_app_url }}
        run: npm run build

      # --- 5. Frontend zur Static Web App deployen --------------------------------
      - name: Deployment-Token abrufen
        id: swa-token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ steps.infra.outputs.static_web_app_name }}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Frontend deployen
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
